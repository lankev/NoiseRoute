name: validate
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train,bench,export,dev]' && python -m pip install ./rust
      - run: python -m ruff check src tests scripts examples
      - run: python -m ruff format --check src tests scripts examples
      - run: python -m pytest -q
        env:
          NOISEROUTE_CORE: rust
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: packages-py${{ matrix.python }}
          path: dist/*
  windows-corpus:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_io_export.py -k dataset_roundtrip -q
  windows-training:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/test_competitive.py tests/test_training_quality.py tests/test_training_recovery.py -q
